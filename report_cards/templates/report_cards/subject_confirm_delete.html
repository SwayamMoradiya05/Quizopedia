<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete subject | Quizopedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 680px;">
        <section class="card border-danger shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 text-danger mb-3">Delete {{ subject.name }}?</h1>
                <p class="text-secondary">Deleting this subject also deletes its questions and options.</p>
                <form method="post" class="d-flex gap-2 mt-4">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Delete subject</button>
                    <a class="btn btn-outline-secondary" href="{% url 'subject_list' %}">Cancel</a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
