<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete subject | Quizopedia</title>
    <style>
        body { margin: 0; background: #f5f6f4; color: #26332f; font-family: Inter, "Segoe UI", Arial, sans-serif; }
        main { width: min(600px, calc(100% - 40px)); margin: 40px auto; }
        section { padding: 24px; border: 1px solid #e4e8e4; border-radius: 12px; background: #fff; }
        button { padding: 10px 15px; border: 0; border-radius: 7px; background: #8b4032; color: #fff; cursor: pointer; font: inherit; font-weight: 650; }
        a { margin-left: 12px; color: #356348; }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Delete {{ subject.name }}?</h1>
            <p>Deleting this subject also deletes its questions and options.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit">Delete subject</button>
                <a href="{% url 'subject_list' %}">Cancel</a>
            </form>
        </section>
    </main>
</body>
</html>
