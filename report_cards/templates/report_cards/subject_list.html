<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage subjects | Quizopedia</title>
    <style>
        body { margin: 0; background: #f5f6f4; color: #26332f; font-family: Inter, "Segoe UI", Arial, sans-serif; }
        main { width: min(800px, calc(100% - 40px)); margin: 40px auto; }
        section { margin-top: 20px; padding: 24px; border: 1px solid #e4e8e4; border-radius: 12px; background: #fff; }
        h1 { margin-top: 0; }
        a { color: #356348; }
        .actions { display: flex; gap: 12px; }
        .subject { padding: 16px 0; border-bottom: 1px solid #edf0ed; }
        .subject:last-child { border-bottom: 0; }
        .description { color: #66746d; white-space: pre-wrap; }
        .message { color: #356348; }
        button { padding: 8px 12px; border: 0; border-radius: 6px; background: #fff0ed; color: #8b4032; cursor: pointer; font: inherit; }
    </style>
</head>
<body>
    <main>
        <p><a href="{% url 'admin_dashboard' %}">Back to dashboard</a></p>
        <h1>Manage subjects</h1>
        {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
        <p><a href="{% url 'subject_create' %}">Add a subject</a></p>
        <section>
            {% for subject in subjects %}
                <article class="subject">
                    <h2>{{ subject.name }}</h2>
                    <p class="description">{{ subject.description|default:"No description." }}</p>
                    <div class="actions">
                        <a href="{% url 'subject_update' subject.id %}">Edit</a>
                        <a href="{% url 'subject_delete' subject.id %}">Delete</a>
                    </div>
                </article>
            {% empty %}
                <p>No subjects have been added yet.</p>
            {% endfor %}
        </section>
    </main>
</body>
</html>
